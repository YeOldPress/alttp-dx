name: Set up Zig 0.17.0
description: Downloads Zig from ziglang.org and checks it against a pinned SHA-256.

# Plain shell rather than mlugg/setup-zig, which runs on Node and still
# targets Node 20. Moving to another Zig version means updating every
# checksum here from https://ziglang.org/download/index.json.
runs:
  using: composite
  steps:
  - if: ${{ runner.os != 'Windows' }}
    shell: bash
    run: |
      case "$RUNNER_OS-$RUNNER_ARCH" in
        Linux-X64)   triple=x86_64-linux;  sum=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 ;;
        macOS-ARM64) triple=aarch64-macos; sum=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a ;;
        macOS-X64)   triple=x86_64-macos;  sum=4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6 ;;
        *) echo "No Zig checksum for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
      esac
      name=zig-$triple-0.17.0
      curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.xz" "https://ziglang.org/download/0.17.0/$name.tar.xz"
      # macOS has shasum, and a bare Linux container may only have sha256sum.
      if command -v sha256sum >/dev/null; then check="sha256sum -c -"; else check="shasum -a 256 -c -"; fi
      echo "$sum  $RUNNER_TEMP/$name.tar.xz" | $check
      tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
      echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
  - if: ${{ runner.os == 'Windows' }}
    shell: pwsh
    run: |
      $name = "zig-x86_64-windows-0.17.0"
      $zip = "$env:RUNNER_TEMP\$name.zip"
      Invoke-WebRequest -Uri "https://ziglang.org/download/0.17.0/$name.zip" -OutFile $zip -MaximumRetryCount 3
      if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "B5663F69581DCF391293FBF16C06CB80D81D806545CE618B4D0BAB7F0EB8C428") {
        throw "Zig download failed its checksum"
      }
      Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
      "$env:RUNNER_TEMP\$name" | Out-File -FilePath $env:GITHUB_PATH -Append
  - shell: bash
    run: zig version
