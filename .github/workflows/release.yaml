name: Release

on:
  push:
    tags:
    - 'v*'
    # Packaging changes on main get built too, without publishing anything,
    # so a broken bundle turns up before the tag does. Tag pushes ignore the
    # path filter.
    branches:
    - main
    paths:
    - .github/workflows/release.yaml
    - .github/actions/**
    - src/platform/**
    - src/menu.zig
    - src/tools_*.zig
    - build.zig
  workflow_dispatch:

jobs:
  # An app bundle is read-only as far as the game is concerned, so the ini,
  # assets and saves go in ~/Library/Application Support/alttp-zig; the
  # game sees it is inside a bundle and moves there itself.
  package-mac:
    name: package for Mac
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-zig
    # Homebrew's SDL3, like a native zig build, only runs on the macOS the
    # runner has. Both are built for macOS 11 instead, to match Info.plist.
    - name: Build SDL3
      run: |
        ver=3.4.16
        curl -fsSL -o sdl3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-$ver/SDL3-$ver.tar.gz
        tar -xzf sdl3.tar.gz
        cmake -S SDL3-$ver -B sdl3-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/sdl3" \
          -DCMAKE_INSTALL_LIBDIR=lib -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES=arm64
        cmake --build sdl3-build --parallel
        cmake --install sdl3-build
    # An explicit target also means a baseline CPU rather than the runner's.
    - name: Build
      run: zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos.11.0 --prefix out -Dsdl-include="$PWD/sdl3/include" -Dsdl-lib="$PWD/sdl3/lib"
    # The game and the asset tools each get a bundle; both keep their
    # files in the same data directory.
    - name: Make the app bundles
      run: |
        bundle() { # bundle NAME EXECUTABLE PLIST
          app=$1.app/Contents
          mkdir -p $app/MacOS $app/Resources
          cp out/bin/$2 $app/MacOS/
          cp LICENSE.txt src/platform/macos/AppIcon.icns $app/Resources/
          sed "s/@VERSION@/${GITHUB_REF_NAME#v}/" src/platform/macos/$3 > $app/Info.plist
          # SDL3 goes inside, and the executable gets pointed at it.
          cp sdl3/lib/libSDL3.0.dylib $app/MacOS/
          chmod u+w $app/MacOS/libSDL3.0.dylib
          install_name_tool -id @executable_path/libSDL3.0.dylib $app/MacOS/libSDL3.0.dylib
          old=$(otool -L $app/MacOS/$2 | awk '/libSDL3/ {print $1}')
          install_name_tool -change "$old" @executable_path/libSDL3.0.dylib $app/MacOS/$2
          # Rewriting load paths breaks signatures. The bundle is signed
          # last, which signs its main executable.
          codesign --force -s - $app/MacOS/libSDL3.0.dylib
          codesign --force -s - $1.app
          codesign --verify --deep --strict $1.app
          # Anything still asking for a newer macOS, or for Homebrew, would
          # only work on machines like the runner.
          for f in $app/MacOS/*; do
            otool -l $f | grep -q "minos 11.0" || { echo "$f needs a newer macOS"; exit 1; }
            if otool -L $f | grep -q /opt/homebrew; then echo "$f links Homebrew"; exit 1; fi
          done
        }
        bundle alttp-zig zelda3 Info.plist
        bundle zelda3-tools zelda3-tools ToolsInfo.plist
    - name: Check the bundle starts
      run: |
        # It should settle in the data directory and write its ini there.
        dir=$(alttp-zig.app/Contents/MacOS/zelda3 --data-dir)
        echo "data directory: $dir"
        case "$dir" in *"Application Support/alttp-zig") ;; *) exit 1 ;; esac
        test -f "$dir/zelda3.ini"
    - name: Check the tools start
      run: zelda3-tools.app/Contents/MacOS/zelda3-tools help
    # Two downloads: the game, and the tools for modding and languages.
    - name: Archive
      run: |
        ditto -c -k --keepParent alttp-zig.app alttp-zig-${{ github.ref_name }}-macos-arm64.zip
        ditto -c -k --keepParent zelda3-tools.app zelda3-tools-${{ github.ref_name }}-macos-arm64.zip
    - uses: actions/upload-artifact@v7
      with:
        name: Mac
        path: |
          alttp-zig-${{ github.ref_name }}-macos-arm64.zip
          zelda3-tools-${{ github.ref_name }}-macos-arm64.zip

  # Built in an Ubuntu 22.04 container so the AppImage asks for no newer glibc
  # than 2.35. Distro SDL3 packages link against a newer one, so SDL3 is built
  # here from source; it loads X11, Wayland and the audio libraries at run
  # time, so the one .so covers whatever the desktop turns out to have.
  package-linux:
    name: package for Linux
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl xz-utils git file \
          build-essential cmake ninja-build pkg-config \
          libasound2-dev libpulse-dev libpipewire-0.3-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev \
          libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-zig
    - name: Build SDL3
      run: |
        ver=3.4.16
        curl -fsSL -o sdl3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-$ver/SDL3-$ver.tar.gz
        tar -xzf sdl3.tar.gz
        cmake -S SDL3-$ver -B sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$PWD/sdl3" -DCMAKE_INSTALL_LIBDIR=lib -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
        cmake --build sdl3-build
        cmake --install sdl3-build
    # An explicit target also means a baseline CPU rather than the runner's.
    - name: Build
      run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu.2.35 --prefix out -Dsdl-include="$PWD/sdl3/include" -Dsdl-lib="$PWD/sdl3/lib"
    # Two AppImages from the one build: the game, and the tools.
    - name: Make the AppImages
      run: |
        curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
        echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
        chmod +x appimagetool
        appimage() { # appimage NAME EXECUTABLE PLATFORM_DIR
          dir=$1.AppDir
          mkdir -p $dir/usr/bin $dir/usr/lib $dir/usr/share/$1
          cp out/bin/$2 $dir/usr/bin/
          cp -L sdl3/lib/libSDL3.so.0 $dir/usr/lib/
          cp LICENSE.txt $dir/usr/share/$1/
          cp $3/AppRun $3/$1.desktop $dir/
          cp src/platform/linux/alttp-zig.png $dir/$1.png
          chmod +x $dir/AppRun
          # No FUSE in a container, so the tool unpacks itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool $dir $1-${{ github.ref_name }}-x86_64.AppImage
        }
        appimage alttp-zig zelda3 src/platform/linux
        appimage zelda3-tools zelda3-tools src/platform/linux/tools
    - name: Check the AppImages start
      run: |
        # The game should settle in the data directory and write its ini there.
        dir=$(APPIMAGE_EXTRACT_AND_RUN=1 ./alttp-zig-${{ github.ref_name }}-x86_64.AppImage --data-dir)
        echo "data directory: $dir"
        case "$dir" in *".local/share/alttp-zig") ;; *) exit 1 ;; esac
        test -f "$dir/zelda3.ini"
        APPIMAGE_EXTRACT_AND_RUN=1 ./zelda3-tools-${{ github.ref_name }}-x86_64.AppImage help
    - uses: actions/upload-artifact@v7
      with:
        name: Linux
        path: |
          alttp-zig-${{ github.ref_name }}-x86_64.AppImage
          zelda3-tools-${{ github.ref_name }}-x86_64.AppImage

  package-windows:
    name: package for Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-zig
    - name: Install SDL3
      shell: pwsh
      run: |
        $ver = "3.4.16"
        $url = "https://github.com/libsdl-org/SDL/releases/download/release-$ver/SDL3-devel-$ver-mingw.zip"
        Invoke-WebRequest -Uri $url -OutFile sdl3.zip
        Expand-Archive sdl3.zip -DestinationPath sdl3
        "SDL3_ROOT=$PWD\sdl3\SDL3-$ver\x86_64-w64-mingw32" | Out-File -FilePath $env:GITHUB_ENV -Append
    - name: Build
      shell: pwsh
      run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu --prefix out -Dsdl-include="$env:SDL3_ROOT\include" -Dsdl-lib="$env:SDL3_ROOT\bin"
    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory pkg\alttp-zig, pkg\zelda3-tools | Out-Null
        Copy-Item out\bin\zelda3.exe, "$env:SDL3_ROOT\bin\SDL3.dll", zelda3.ini, README.md, LICENSE.txt pkg\alttp-zig\
        Copy-Item out\bin\zelda3-tools.exe, "$env:SDL3_ROOT\bin\SDL3.dll", LICENSE.txt pkg\zelda3-tools\
        Compress-Archive pkg\alttp-zig "alttp-zig-${{ github.ref_name }}-windows-x86_64.zip"
        Compress-Archive pkg\zelda3-tools "zelda3-tools-${{ github.ref_name }}-windows-x86_64.zip"
    - name: Check the tools start
      shell: pwsh
      run: |
        pkg\zelda3-tools\zelda3-tools.exe help
        if ($LASTEXITCODE -ne 0) { exit 1 }
    - uses: actions/upload-artifact@v7
      with:
        name: Windows
        path: |
          alttp-zig-${{ github.ref_name }}-windows-x86_64.zip
          zelda3-tools-${{ github.ref_name }}-windows-x86_64.zip

  release:
    name: publish
    needs: [package-mac, package-linux, package-windows]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        notes=.github/release-notes/${{ github.ref_name }}.md
        if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
        gh release create ${{ github.ref_name }} dist/* --title "${{ github.ref_name }}" --verify-tag "$@"
