name: Build

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

jobs:
  build-unix:
    name: on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          # libsdl3-dev landed in Ubuntu 25.10; ubuntu-latest is still 24.04
          # until GitHub's late-2026 migration, so pin an image that has it.
          os: ubuntu-26.04
        - name: Mac
          os: macos-latest
    steps:
    - uses: actions/checkout@v3
    - uses: mlugg/setup-zig@v1
      with:
        version: 0.16.0
    - name: Install dependencies for Linux
      if: ${{ matrix.name == 'Linux' }}
      run: |
        sudo apt update
        sudo apt install -y libsdl3-dev
    - name: Install dependencies for Mac
      if: ${{ matrix.name == 'Mac' }}
      # SDL3 ships no sdl3-config, so build.zig locates it with pkg-config.
      run: |
        brew install sdl3
        command -v pkg-config >/dev/null || brew install pkgconf
    - name: Build
      run: zig build
    - name: Test
      run: zig build test
